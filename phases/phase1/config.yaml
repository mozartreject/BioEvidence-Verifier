data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_root: "data/images"
  honest_ooc: "data/raw/honest_ooc_clean_long.csv"
  fakehealth: "data/raw/fakehealth_content.csv"
  recovery: "data/raw/recovery-news-data.csv"
  honest_ooc_cap_per_label: null
  val_ratio: 0.15
  test_ratio: 0.15
  random_state: 42

model:
  biobert: "dmis-lab/biobert-base-cased-v1.1"
  vit: "google/vit-base-patch16-224"
  fusion_type: "concat"
  hidden_dim: 768
  dropout: 0.1
  freeze_biobert: true
  freeze_vit: true
  unfreeze_biobert_top_n: 4
  unfreeze_vit_top_n: 2

training:
  mode: "binary"
  epochs: 15
  batch_size: 16
  accum_steps: 1
  lr: 2.0e-4
  weight_decay: 1.0e-2
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  early_stopping_patience: 5
  focal_alpha: 0.25
  focal_gamma: 2.0
  contrastive_margin: 0.5
  temperature: 0.07
  use_augmentation: true
  use_amp: true

evaluation:
  threshold_search_min: 0.05
  threshold_search_max: 0.95
  threshold_search_step: 0.05

system:
  device: "cuda"
  num_workers: 4
  pin_memory: true
  seed: 42

logging:
  log_dir: "checkpoints/logs"
  checkpoint_dir: "checkpoints"
  save_every_n_epochs: 1
  log_interval: 10